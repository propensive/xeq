name: Build

# Build every pull request and every merge into main, via the shared workflows in
# propensive/.github: the Scala modules with Mill, their suites run by the fume pinned in
# etc/tools, and the runner stubs' unit tests with Cargo. Both checks, `build / build` and
# `rust / build`, are required by the ruleset on main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: propensive/.github/.github/workflows/scala-ci.yml@main
    with:
      # `xeq.script` writes dist/xeq, which the suite drives and which nothing else in CI
      # produces — the shared workflow runs these targets and then `fume`, never the Makefile.
      compile:       xeq.all xeq.script
      test_assembly: xeq.test.assembly

  rust:
    uses: propensive/.github/.github/workflows/rust-ci.yml@main
